<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Editor</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #f0508c; --purple: #7c6cf0; --purple-dark: #4b3aa8; --green: #3cc47c; --orange: #ff9a3c;
    --cream: #fffaf0; --ink: #2d2a4a; --soft: #8a84a8; --line: #e3dcf7; --bg: #6a5acd; --red: #c2410c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Nunito, system-ui, sans-serif; color: var(--ink); background: var(--bg); font-size: 16px; }
  h1, h2, h3, .btn, .tab { font-family: DynaPuff, Nunito, sans-serif; }
  button { font: inherit; cursor: pointer; }
  .btn { border: 0; border-radius: 14px; padding: 9px 18px; color: #fff; background: var(--purple); border-bottom: 4px solid rgba(0,0,0,.2); font-weight: 600; }
  .btn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .btn.green { background: var(--green); } .btn.pink { background: var(--pink); } .btn.grey { background: #9a94b8; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .small { font-size: 14px; padding: 5px 12px; border-radius: 10px; }

  /* Lock screen */
  #lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .lockcard { background: var(--cream); border: 6px solid var(--purple); border-radius: 24px; padding: 28px 30px; width: min(420px, 100%); text-align: center; box-shadow: 0 10px 30px rgba(20,0,60,.35); }
  .lockcard h1 { color: var(--pink); margin: 0 0 4px; font-size: 30px; }
  .lockcard input { width: 100%; font-size: 18px; padding: 10px 12px; border: 3px solid #b3a8e8; border-radius: 12px; margin: 16px 0 12px; }
  .lockcard .err { color: var(--red); min-height: 22px; }

  /* App */
  #app { display: none; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; color: #fff; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 24px; }
  header .spacer { flex: 1; }
  header select { font: inherit; padding: 7px 10px; border-radius: 10px; border: 0; }
  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; padding: 0 16px 24px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  nav.files { background: var(--cream); border-radius: 18px; padding: 10px; align-self: start; position: sticky; top: 10px; }
  nav.files button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 10px; color: var(--ink); }
  nav.files button.on { background: var(--purple); color: #fff; }
  nav.files button .dot { float: right; color: var(--orange); font-weight: 700; }
  nav.files button.on .dot { color: #ffd98a; }
  nav.files .grp { font-family: DynaPuff, sans-serif; color: var(--soft); font-size: 13px; margin: 8px 10px 4px; }

  main { min-width: 0; }
  .bar { background: var(--cream); border-radius: 18px; padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; position: sticky; top: 10px; z-index: 5; box-shadow: 0 6px 16px rgba(20,0,60,.2); }
  .bar .where { flex: 1; min-width: 200px; }
  .bar .where b { font-family: DynaPuff, sans-serif; color: var(--purple-dark); }
  .bar .where div { color: var(--soft); font-size: 13px; }
  .problems { background: #fff1ea; border: 2px solid #ffc7a8; border-radius: 12px; padding: 8px 14px; margin: 0 0 14px; color: var(--red); }
  .problems ul { margin: 4px 0; padding-left: 20px; }
  .ok { background: #eafbf1; border: 2px solid #b6ecd0; border-radius: 12px; padding: 8px 14px; margin: 0 0 14px; color: #1f8a52; }

  details.section { background: var(--cream); border-radius: 18px; margin-bottom: 12px; }
  details.section > summary { cursor: pointer; padding: 14px 18px; font-family: DynaPuff, sans-serif; font-size: 19px; color: var(--purple-dark); list-style: none; }
  details.section > summary::before { content: "▸ "; color: var(--pink); }
  details.section[open] > summary::before { content: "▾ "; }
  details.section > .inner { padding: 0 18px 16px; }
  .item { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
  .item.bad { border-color: #ffb08a; }
  .item h3 { margin: 0 0 8px; font-size: 16px; color: var(--pink); }
  .item h3 .tag { font-family: Nunito, sans-serif; font-size: 12px; color: var(--soft); font-weight: 600; margin-left: 6px; }
  label { display: block; font-weight: 700; font-size: 14px; margin: 10px 0 4px; color: var(--purple-dark); }
  label .help { font-weight: 400; color: var(--soft); }
  input[type=text], textarea { width: 100%; font: inherit; padding: 8px 10px; border: 2px solid #d6cff2; border-radius: 10px; background: #fff; color: var(--ink); }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--purple); }
  textarea { resize: vertical; min-height: 44px; line-height: 1.4; }
  textarea.md { min-height: 220px; font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
  .choices .ch { display: flex; gap: 8px; align-items: center; margin: 5px 0; }
  .choices .ch input[type=radio] { width: 20px; height: 20px; accent-color: var(--green); flex: none; }
  .choices .ch.right input[type=text] { border-color: var(--green); background: #f1fcf6; }
  .note { color: var(--soft); font-size: 13px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .row2 { grid-template-columns: 1fr; } }

  /* Whiteboard preview, styled like the game */
  .wb { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 1000px) { .wb { grid-template-columns: 1fr; } }
  .preview { border: 4px solid #8f73e6; border-radius: 16px; padding: 10px 16px; background: #fff; font-family: DynaPuff, sans-serif; font-weight: 400; font-size: 15px; overflow: auto; max-height: 420px; }
  .preview h1 { color: var(--pink); font-size: 22px; margin: 6px 0; }
  .preview h2 { color: var(--purple); font-size: 18px; margin: 6px 0; }
  .preview strong { font-weight: 700; }
  .preview em { font-style: italic; }
  .preview .tip { background: #efe9ff; color: #6a5fb0; padding: 3px 8px; margin: 4px 0; }
  .preview table { border-collapse: collapse; margin: 6px 0; }
  .preview th { background: #5a4fcf; color: #fff; padding: 4px 10px; }
  .preview td { background: #f2effd; padding: 4px 10px; border: 2px solid #fff; }
  .preview p { margin: 4px 0; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--purple-dark); color: #fff; padding: 12px 20px; border-radius: 14px; font-family: DynaPuff, sans-serif; display: none; z-index: 20; }
  .howto { background: var(--cream); border-radius: 18px; padding: 16px 20px; margin-bottom: 14px; }
  .howto h2 { color: var(--pink); margin: 0 0 6px; }
  .howto ol { margin: 6px 0; padding-left: 22px; }
</style>
</head>
<body>

<div id="lock">
  <form class="lockcard" id="lockform">
    <h1>Island Editor</h1>
    <div class="note">Edit the questions and titles of the games</div>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
    <div class="err" id="pwerr"></div>
    <button class="btn green" type="submit">Open</button>
  </form>
</div>

<div id="app">
  <header>
    <h1>Island Editor</h1>
    <select id="gamesel"></select>
    <span class="spacer"></span>
    <button class="btn grey small" id="helpbtn">How it works</button>
  </header>
  <div class="layout">
    <nav class="files" id="files"></nav>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------------------------------------------------------------------------------------------
// Password: a SHA-256 hash of the admin password (change it with tools/set_editor_password.py).
// This only keeps students out of the editor - the files it makes are downloaded, never saved
// to the site, so there is nothing here that could change the live game.
const PASSWORD_SHA256 = "33e4b311390fb53f9d79540d2127011178afbdfa334a77b942a22ac962022efd";
// ---------------------------------------------------------------------------------------------

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const state = { games: [], game: null, files: [], current: null, original: {}, edited: {} };

async function sha256(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
}

$("#lockform").addEventListener("submit", async (e) => {
  e.preventDefault();
  if ((await sha256($("#pw").value)) === PASSWORD_SHA256) {
    sessionStorage.setItem("editor-ok", "1");
    start();
  } else {
    $("#pwerr").textContent = "That's not the right password.";
  }
});
if (sessionStorage.getItem("editor-ok") === "1") start();

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.style.display = "none"), 2600);
}

async function getJSON(path) {
  const r = await fetch(path + (path.includes("?") ? "&" : "?") + "t=" + Date.now());
  if (!r.ok) throw new Error(path + " could not be loaded");
  return r.json();
}

async function start() {
  $("#lock").style.display = "none";
  $("#app").style.display = "block";
  try {
    state.games = (await getJSON("games.json")).games;
  } catch (e) {
    $("#main").innerHTML = `<div class="problems">Couldn't load games.json - open this editor from the game's website.</div>`;
    return;
  }
  const sel = $("#gamesel");
  sel.innerHTML = state.games.map((g, i) => `<option value="${i}">${esc(g.title)}</option>`).join("");
  sel.onchange = () => loadGame(+sel.value);
  $("#helpbtn").onclick = () => { state.current = null; renderFiles(); showHelp(); };
  await loadGame(0);
}

async function loadGame(i) {
  state.game = state.games[i];
  const cfgPath = state.game.config;
  const cfg = await getJSON(cfgPath);
  keep(cfgPath, cfg);
  state.files = [{ path: cfgPath, label: "Game title & island names", kind: "config" }];
  for (const [n, c] of cfg.course.entries()) {
    state.files.push({ path: c.file, label: `Isla ${n + 1}: ${c.title}`, kind: "lesson" });
  }
  renderFiles();
  showHelp();
}

// Remember the original of each file, and any draft saved in this browser.
function keep(path, data) {
  if (!(path in state.original)) state.original[path] = clone(data);
  if (!(path in state.edited)) {
    const draft = localStorage.getItem("draft:" + path);
    state.edited[path] = draft ? JSON.parse(draft) : clone(data);
  }
}
function changed(path) {
  return path in state.edited && JSON.stringify(state.edited[path]) !== JSON.stringify(state.original[path]);
}
function saveDraft(path) {
  if (changed(path)) localStorage.setItem("draft:" + path, JSON.stringify(state.edited[path]));
  else localStorage.removeItem("draft:" + path);
}

function renderFiles() {
  const nav = $("#files");
  nav.innerHTML = `<div class="grp">${esc(state.game.title)}</div>` + state.files.map((f, i) =>
    `<button data-i="${i}" class="${state.current === f.path ? "on" : ""}">${esc(f.label)}${changed(f.path) ? '<span class="dot" title="changed">●</span>' : ""}</button>`).join("");
  nav.querySelectorAll("button").forEach((b) => (b.onclick = () => openFile(state.files[+b.dataset.i])));
}

function showHelp() {
  $("#main").innerHTML = `<div class="howto">
    <h2>How it works</h2>
    <ol>
      <li>Pick an island on the left (or the game title & island names).</li>
      <li>Change any text you like. Nothing you do here changes the game yet.</li>
      <li>Click <b>Download</b>. You get a file with exactly the right name.</li>
      <li>Send the file on to be put on the website.</li>
    </ol>
    <p class="note">Your changes are kept in this browser until you download them, so it's safe to close the page and come back later. An orange dot ● shows which islands have changes.</p>
    <p class="note">Questions, answers, hints, whiteboard pages, postcards, notice boards and detective reviews can all be edited. The layout of the islands can't be changed here - that keeps the game safe.</p>
  </div>`;
}

async function openFile(f) {
  if (!(f.path in state.edited)) {
    try { keep(f.path, await getJSON(f.path)); }
    catch (e) { toast("Couldn't load " + f.path); return; }
  }
  state.current = f.path;
  renderFiles();
  render();
}

// ---------------------------------------------------------------------------------------------
// Building the form. Every field is bound to a spot in the edited copy of the file; only
// text is edited, so ids, kinds, positions and set-piece settings are never touched.

function field(obj, key, label, opts = {}) {
  const id = "f" + Math.random().toString(36).slice(2);
  const v = obj[key] ?? "";
  const help = opts.help ? ` <span class="help">${esc(opts.help)}</span>` : "";
  const box = opts.multi
    ? `<textarea id="${id}" rows="${opts.rows || 2}" class="${opts.cls || ""}">${esc(v)}</textarea>`
    : `<input type="text" id="${id}" value="${esc(v)}">`;
  const wrap = document.createElement("div");
  wrap.innerHTML = `<label for="${id}">${esc(label)}${help}</label>${box}`;
  const el = wrap.querySelector("#" + id);
  el.addEventListener("input", () => { obj[key] = el.value; touched(); opts.onInput && opts.onInput(el.value); });
  return wrap;
}

function listField(obj, key, label, help) {
  // A list of strings, one per line (e.g. accepted answers).
  const id = "f" + Math.random().toString(36).slice(2);
  const wrap = document.createElement("div");
  wrap.innerHTML = `<label for="${id}">${esc(label)} <span class="help">${esc(help)}</span></label><textarea id="${id}" rows="${Math.max(2, (obj[key] || []).length)}">${esc((obj[key] || []).join("\n"))}</textarea>`;
  const el = wrap.querySelector("textarea");
  el.addEventListener("input", () => { obj[key] = el.value.split("\n").map((s) => s.trim()).filter(Boolean); touched(); });
  return wrap;
}

function choicesField(q, label, locked) {
  // Multiple choice: the text of each choice, and a tick for the right one.
  const name = "c" + Math.random().toString(36).slice(2);
  const wrap = document.createElement("div");
  wrap.className = "choices";
  wrap.innerHTML = `<label>${esc(label)} <span class="help">(tick the right answer)</span></label>`;
  q.choices.forEach((c, i) => {
    const row = document.createElement("div");
    row.className = "ch" + (i === q.correct ? " right" : "");
    row.innerHTML = `<input type="radio" name="${name}" ${i === q.correct ? "checked" : ""} title="This is the right answer"><input type="text" value="${esc(c)}" ${locked ? "readonly" : ""}>`;
    row.querySelector("input[type=radio]").onchange = () => {
      q.correct = i;
      wrap.querySelectorAll(".ch").forEach((r, k) => r.classList.toggle("right", k === i));
      touched();
    };
    row.querySelector("input[type=text]").oninput = (e) => { q.choices[i] = e.target.value; touched(); };
    wrap.appendChild(row);
  });
  return wrap;
}

function questionItem(q, title, tag) {
  const it = document.createElement("div");
  it.className = "item";
  it.innerHTML = `<h3>${esc(title)}<span class="tag">${esc(tag || "")}</span></h3>`;
  it.appendChild(field(q, "question", "Question", { multi: true, help: "(use ____ for a gap)" }));
  if (Array.isArray(q.choices) && q.choices.length) it.appendChild(choicesField(q, "Choices"));
  else if (Array.isArray(q.answers)) it.appendChild(listField(q, "answers", "Accepted answers", "(one per line - every version you'll accept; capitals and missing accents are forgiven)"));
  const row = document.createElement("div");
  row.className = "row2";
  if ("hint" in q) row.appendChild(field(q, "hint", "Hint", { help: "(shown after a wrong answer)" }));
  if ("explanation" in q) row.appendChild(field(q, "explanation", "Explanation", { help: "(shown after a right answer)" }));
  it.appendChild(row);
  it.dataset.check = "q";
  it._q = q;
  return it;
}

function section(title, open = false) {
  const d = document.createElement("details");
  d.className = "section";
  d.open = open;
  d.innerHTML = `<summary>${esc(title)}</summary><div class="inner"></div>`;
  return [d, d.querySelector(".inner")];
}

function render() {
  const path = state.current;
  const f = state.files.find((x) => x.path === path);
  const d = state.edited[path];
  const main = $("#main");
  main.innerHTML = "";
  const bar = document.createElement("div");
  bar.className = "bar";
  bar.innerHTML = `<div class="where"><b>${esc(f.label)}</b><div>${esc(path)}</div></div>
    <button class="btn grey small" id="undo">Undo my changes</button>
    <button class="btn green" id="dl">Download</button>`;
  main.appendChild(bar);
  const probs = document.createElement("div");
  probs.id = "problems";
  main.appendChild(probs);
  $("#undo").onclick = () => {
    if (!changed(path)) { toast("Nothing to undo"); return; }
    if (!confirmBox("Throw away all your changes to this island?")) return;
    state.edited[path] = clone(state.original[path]);
    saveDraft(path); renderFiles(); render();
  };
  $("#dl").onclick = () => download(path);
  if (f.kind === "config") renderConfig(main, d);
  else renderLesson(main, d);
  touched(true);
}

function renderConfig(main, d) {
  const [s, inner] = section("The game", true);
  inner.appendChild(field(d, "game_title", "Game title"));
  inner.appendChild(field(d, "tagline", "Subtitle"));
  if ("intro" in d) inner.appendChild(field(d, "intro", "Welcome text", { multi: true, rows: 3 }));
  main.appendChild(s);
  const [s2, in2] = section("Island names", true);
  d.course.forEach((c, i) => in2.appendChild(field(c, "title", `Isla ${i + 1}`)));
  main.appendChild(s2);
}

function renderLesson(main, d) {
  // The island.
  const [s1, i1] = section("The island", true);
  i1.appendChild(field(d, "title", "Island title"));
  if ("subject" in d) i1.appendChild(field(d, "subject", "Subtitle"));
  if ("intro" in d) i1.appendChild(field(d, "intro", "Introduction", { multi: true }));
  if (d.prize) {
    const r = document.createElement("div");
    r.className = "row2";
    r.appendChild(field(d.prize, "name", "Prize name"));
    r.appendChild(field(d.prize, "message", "Prize message"));
    i1.appendChild(r);
  }
  main.appendChild(s1);

  // Whiteboard pages, with a preview.
  const pages = (d.whiteboard && d.whiteboard.pages) || [];
  if (pages.length) {
    const [s, inner] = section(`Whiteboard (${pages.length} pages)`);
    pages.forEach((p, i) => {
      const it = document.createElement("div");
      it.className = "item";
      it.innerHTML = `<h3>Page ${i + 1}</h3>`;
      it.appendChild(field(p, "title", "Page title"));
      const grid = document.createElement("div");
      grid.className = "wb";
      const pv = document.createElement("div");
      pv.className = "preview";
      pv.innerHTML = mdToHtml(p.markdown);
      grid.appendChild(field(p, "markdown", "Page text", { multi: true, cls: "md", help: "(# heading, **bold**, *italic*, - list, > tip)", onInput: (v) => (pv.innerHTML = mdToHtml(v)) }));
      const pw = document.createElement("div");
      pw.innerHTML = `<label>Preview</label>`;
      pw.appendChild(pv);
      grid.appendChild(pw);
      it.appendChild(grid);
      it.dataset.check = "page";
      it._q = p;
      inner.appendChild(it);
    });
    main.appendChild(s);
  }

  // Cards and chests.
  if (d.cards && d.cards.length) {
    const [s, inner] = section(`Question cards (${d.cards.length})`);
    d.cards.forEach((q, i) => inner.appendChild(questionItem(q, `Card ${i + 1}`, "builds the bridge")));
    main.appendChild(s);
  }
  if (d.chests && d.chests.length) {
    const [s, inner] = section(`Quiz chests (${d.chests.length})`);
    d.chests.forEach((q, i) => inner.appendChild(questionItem(q, `Chest ${i + 1}`, q.level ? `level ${q.level}` : "")));
    main.appendChild(s);
  }

  // Sweets: the question (or the sentence-builder question / interview questions).
  if (d.sweets && d.sweets.length) {
    const [s, inner] = section(`Sweets (${d.sweets.length})`);
    d.sweets.forEach((q, i) => {
      if (q.sentence) {
        const it = document.createElement("div");
        it.className = "item";
        it.innerHTML = `<h3>Sweet ${i + 1}<span class="tag">written answer, marked with stars</span></h3>`;
        it.appendChild(field(q.sentence, "question", "Question", { multi: true, onInput: (v) => (q.question = v.replace(/^[^:]*asks:\s*/, "")) }));
        inner.appendChild(it);
      } else if (Array.isArray(q.interview)) {
        const it = document.createElement("div");
        it.className = "item";
        it.innerHTML = `<h3>Sweet ${i + 1}<span class="tag">job interview</span></h3>`;
        q.interview.forEach((iq, k) => it.appendChild(field(iq, "question", `Interview question ${k + 1}`, { multi: true })));
        inner.appendChild(it);
      } else {
        inner.appendChild(questionItem(q, `Sweet ${i + 1}`, "bonus question"));
      }
    });
    main.appendChild(s);
  }

  // Retos (La Isla de los Retos).
  const retos = d.retos || [];
  if (retos.length) {
    const [s, inner] = section(`Retos (${retos.length})`);
    retos.forEach((r, i) => {
      const it = document.createElement("div");
      it.className = "item";
      if (r.kind === "postcard") {
        it.innerHTML = `<h3>Postcard<span class="tag">written answer, marked with stars</span></h3>`;
        it.appendChild(field(r, "question", "Question", { multi: true }));
      } else if (r.kind === "notice") {
        it.innerHTML = `<h3>Notice board<span class="tag">fix the words in the gaps</span></h3>`;
        it.appendChild(field(r, "intro", "Instructions", { multi: true }));
        it.appendChild(field(r, "text", "Text", { multi: true, rows: 5, help: "(keep the gap numbers {1}, {2} ... in the text)" }));
        it.appendChild(field(r, "hint", "Hint"));
        r.gaps.forEach((g, k) => {
          const row = document.createElement("div");
          row.className = "row2";
          row.appendChild(field(g, "verb", `Gap {${k + 1}}: word given`));
          row.appendChild(listField(g, "answers", `Gap {${k + 1}}: correct form`, "(one per line)"));
          it.appendChild(row);
        });
        it.dataset.check = "notice";
        it._q = r;
      } else if (r.kind === "detective") {
        it.innerHTML = `<h3>Detective<span class="tag">read the reviews - who says what?</span></h3>`;
        const row = document.createElement("div");
        row.className = "row2";
        row.appendChild(field(r, "sign", "Sign"));
        row.appendChild(field(r, "greeting", "Greeting"));
        it.appendChild(row);
        r.speakers.forEach((sp, k) => {
          const rename = () => {
            // The answer choices are the speakers' names, plus "Los dos".
            r.questions.forEach((q) => { q.choices = [...r.speakers.map((x) => x.name), q.choices[q.choices.length - 1]]; });
            it.querySelectorAll(".choices").forEach((c, qi) => c.querySelectorAll("input[type=text]").forEach((t, ci) => (t.value = r.questions[qi].choices[ci])));
          };
          const r2 = document.createElement("div");
          r2.className = "row2";
          r2.appendChild(field(sp, "name", `Person ${k + 1}: name`, { onInput: rename }));
          r2.appendChild(field(sp, "bubble", `Person ${k + 1}: speech bubble`));
          it.appendChild(r2);
          it.appendChild(field(sp, "review", `Person ${k + 1}: review`, { multi: true, rows: 5, cls: "md" }));
        });
        r.questions.forEach((q, k) => {
          const qi = document.createElement("div");
          qi.className = "item";
          qi.innerHTML = `<h3>Question ${k + 1}</h3>`;
          qi.appendChild(field(q, "question", "Question"));
          qi.appendChild(choicesField(q, "Who?", true));
          const r3 = document.createElement("div");
          r3.className = "row2";
          r3.appendChild(field(q, "hint", "Hint"));
          r3.appendChild(field(q, "explanation", "Explanation"));
          qi.appendChild(r3);
          it.appendChild(qi);
        });
      } else {
        it.innerHTML = `<h3>${r.kind === "chat" ? "Chat with " + esc(r.name || "") : esc(r.kind)}<span class="tag">not editable here</span></h3>`;
      }
      inner.appendChild(it);
    });
    main.appendChild(s);
  }
}

// ---------------------------------------------------------------------------------------------
// Checks: the game needs every question to be answerable.

function problemsIn(path) {
  const out = [];
  const d = state.edited[path];
  const f = state.files.find((x) => x.path === path);
  const blank = (s) => !String(s ?? "").trim();
  if (f.kind === "config") {
    if (blank(d.game_title)) out.push("The game needs a title.");
    d.course.forEach((c, i) => blank(c.title) && out.push(`Isla ${i + 1} needs a name.`));
    return out;
  }
  if (blank(d.title)) out.push("The island needs a title.");
  const checkQ = (q, name) => {
    if (blank(q.question)) out.push(`${name}: the question is empty.`);
    if (Array.isArray(q.choices) && q.choices.length) {
      q.choices.forEach((c, i) => blank(c) && out.push(`${name}: choice ${i + 1} is empty.`));
      if (!(q.correct >= 0 && q.correct < q.choices.length)) out.push(`${name}: tick the right answer.`);
      const seen = new Set(q.choices.map((c) => c.trim().toLowerCase()));
      if (seen.size < q.choices.length) out.push(`${name}: two choices are the same.`);
    } else if (Array.isArray(q.answers) && !q.answers.length) {
      out.push(`${name}: add at least one accepted answer.`);
    }
  };
  ((d.whiteboard && d.whiteboard.pages) || []).forEach((p, i) => {
    if (blank(p.title)) out.push(`Whiteboard page ${i + 1} needs a title.`);
    if (blank(p.markdown)) out.push(`Whiteboard page ${i + 1} is empty.`);
  });
  (d.cards || []).forEach((q, i) => checkQ(q, `Card ${i + 1}`));
  (d.chests || []).forEach((q, i) => checkQ(q, `Chest ${i + 1}`));
  (d.sweets || []).forEach((q, i) => {
    if (q.sentence) { if (blank(q.sentence.question)) out.push(`Sweet ${i + 1}: the question is empty.`); }
    else if (Array.isArray(q.interview)) q.interview.forEach((iq, k) => blank(iq.question) && out.push(`Sweet ${i + 1}: interview question ${k + 1} is empty.`));
    else checkQ(q, `Sweet ${i + 1}`);
  });
  (d.retos || []).forEach((r) => {
    if (r.kind === "postcard" && blank(r.question)) out.push("A postcard question is empty.");
    if (r.kind === "notice") {
      const found = [...String(r.text).matchAll(/\{(\d+)\}/g)].map((m) => +m[1]);
      for (let k = 1; k <= r.gaps.length; k++) {
        if (!found.includes(k)) out.push(`Notice board: the text is missing gap {${k}}.`);
      }
      found.filter((n) => n < 1 || n > r.gaps.length).forEach((n) => out.push(`Notice board: there's a {${n}} in the text but only ${r.gaps.length} gaps.`));
      r.gaps.forEach((g, k) => { if (!g.answers || !g.answers.length) out.push(`Notice board: gap {${k + 1}} needs a correct form.`); });
    }
    if (r.kind === "detective") {
      r.speakers.forEach((sp, k) => { if (blank(sp.name)) out.push(`Detective: person ${k + 1} needs a name.`); if (blank(sp.review)) out.push(`Detective: person ${k + 1}'s review is empty.`); });
      r.questions.forEach((q, k) => checkQ(q, `Detective question ${k + 1}`));
    }
  });
  return out;
}

function touched(first) {
  const path = state.current;
  if (!path) return;
  if (!first) { saveDraft(path); renderFiles(); }
  const probs = problemsIn(path);
  const box = $("#problems");
  if (probs.length) {
    box.className = "problems";
    box.innerHTML = `<b>Please fix these before downloading:</b><ul>${probs.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>`;
  } else {
    box.className = changed(path) ? "ok" : "";
    box.innerHTML = changed(path) ? "Everything looks good - you can download this island." : "";
  }
  $("#dl").disabled = probs.length > 0 || !changed(path);
}

function download(path) {
  if (problemsIn(path).length) return;
  const blob = new Blob([JSON.stringify(state.edited[path], null, 2) + "\n"], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = path.split("/").pop();
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast("Downloaded " + a.download + " - send it on to go on the website!");
}

function confirmBox(msg) { return window.confirm(msg); }

window.addEventListener("beforeunload", () => { if (state.current) saveDraft(state.current); });

// ---------------------------------------------------------------------------------------------
// A small Markdown preview, close to how the game's whiteboard shows it.
function mdInline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
}
function mdToHtml(md) {
  const lines = String(md || "").split("\n");
  let out = "", list = null, table = null;
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  const closeTable = () => { if (table) { out += "</table>"; table = null; } };
  for (let i = 0; i < lines.length; i++) {
    const s = lines[i].trim();
    if (s.startsWith("|")) {
      closeList();
      if (/^\|[\s:|-]+\|$/.test(s)) continue;
      const cells = s.replace(/^\||\|$/g, "").split("|").map((c) => mdInline(c.trim()));
      if (!table) { table = true; out += "<table><tr>" + cells.map((c) => `<th>${c}</th>`).join("") + "</tr>"; }
      else out += "<tr>" + cells.map((c) => `<td>${c}</td>`).join("") + "</tr>";
      continue;
    }
    closeTable();
    if (!s) { closeList(); continue; }
    if (s.startsWith("## ")) { closeList(); out += `<h2>${mdInline(s.slice(3))}</h2>`; continue; }
    if (s.startsWith("# ")) { closeList(); out += `<h1>${mdInline(s.slice(2))}</h1>`; continue; }
    if (s.startsWith("> ")) { closeList(); out += `<div class="tip">${mdInline(s.slice(2))}</div>`; continue; }
    if (/^[-*] /.test(s)) { if (list !== "ul") { closeList(); list = "ul"; out += "<ul>"; } out += `<li>${mdInline(s.slice(2))}</li>`; continue; }
    if (/^\d+\. /.test(s)) { if (list !== "ol") { closeList(); list = "ol"; out += "<ol>"; } out += `<li>${mdInline(s.replace(/^\d+\. /, ""))}</li>`; continue; }
    closeList();
    out += `<p>${mdInline(s)}</p>`;
  }
  closeList(); closeTable();
  return out;
}
