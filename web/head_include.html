<style>
body{background:#6a5acd}
#li-ask{position:fixed;inset:0;display:none;z-index:1000;background:rgba(40,20,80,0.55);padding:8px;box-sizing:border-box}
#li-card{max-width:820px;margin:0 auto;background:#fffaf0;border:5px solid #7c6cf0;border-radius:18px;padding:8px 14px 10px;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:#2d2a4a;box-shadow:0 6px 16px rgba(20,0,60,0.35)}
#li-q{font-size:16px;font-weight:700;margin:2px 0 6px;max-height:3.6em;overflow:auto;color:#4b3aa8}
#li-in{display:block;width:100%;box-sizing:border-box;font-size:18px;padding:8px 10px;border:3px solid #b3a8e8;border-radius:12px;resize:none;font-family:inherit;color:#2d2a4a;background:#fff;outline:none}
#li-in:focus{border-color:#7c6cf0}
#li-row{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.li-b{font-size:17px;font-weight:800;border:0;border-radius:14px;padding:8px 20px;color:#fff;font-family:inherit;border-bottom:4px solid rgba(0,0,0,0.2)}
#li-cancel{background:#9a94b8}
#li-ok{background:#3cc47c}
</style>
<script>
(function(){
  var touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  /* Phones and tablets: go fullscreen (no address bar) on the first tap, and again after
     the student leaves fullscreen. Browsers only allow this straight after a tap. */
  function goFull(){
    if (!touch || document.fullscreenElement) return;
    var el = document.documentElement;
    if (!el.requestFullscreen) return;
    el.requestFullscreen({navigationUI: 'hide'}).then(function(){
      try { screen.orientation.lock('landscape').catch(function(){}); } catch (e) {}
    }).catch(function(){});
  }
  document.addEventListener('pointerup', function(ev){
    if (ev.target && ev.target.closest && ev.target.closest('#li-ask')) return;
    goFull();
  }, true);
  /* A game-styled text box at the top of the screen (the phone keyboard opens below it).
     The game calls liAsk(question, text, multiline) and waits for liState 'ok' or 'cancel'. */
  var box = null, input = null, qEl = null;
  function build(multi){
    if (!box){
      box = document.createElement('div'); box.id = 'li-ask';
      box.innerHTML = '<div id=li-card><div id=li-q></div><div id=li-slot></div><div id=li-row><button class=li-b id=li-cancel>Cancelar</button><button class=li-b id=li-ok>OK</button></div></div>';
      document.body.appendChild(box);
      qEl = box.querySelector('#li-q');
      box.querySelector('#li-cancel').onclick = function(){ close('cancel'); };
      box.querySelector('#li-ok').onclick = function(){ close('ok'); };
      ['keydown','keyup','keypress'].forEach(function(t){ box.addEventListener(t, function(e){ e.stopPropagation(); }); });
    }
    var slot = box.querySelector('#li-slot');
    slot.innerHTML = '';
    input = document.createElement(multi ? 'textarea' : 'input');
    input.id = 'li-in';
    if (multi) input.rows = 3; else input.type = 'text';
    input.setAttribute('autocomplete', 'off');
    input.setAttribute('autocapitalize', 'sentences');
    input.setAttribute('spellcheck', 'false');
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !multi){ e.preventDefault(); close('ok'); } });
    slot.appendChild(input);
  }
  function close(state){
    window.liValue = input ? input.value : '';
    window.liState = state;
    if (input) input.blur();
    box.style.display = 'none';
  }
  /* Typing straight into a question card: an invisible text field takes the phone keyboard's
     input; the game copies liTypeValue into the card as it changes, and Enter sets liTypeEnter. */
  var ghost = null;
  window.liTypeStart = function(text){
    if (!ghost){
      /* A one-row textarea rather than an input: Chrome doesn't show its autofill bar
         (passwords / cards / addresses) above the keyboard for textareas. */
      ghost = document.createElement('textarea');
      ghost.rows = 1;
      ghost.setAttribute('autocomplete', 'off');
      ghost.setAttribute('autocapitalize', 'off');
      ghost.setAttribute('spellcheck', 'false');
      ghost.setAttribute('autocorrect', 'off');
      ghost.setAttribute('enterkeyhint', 'done');
      ghost.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;z-index:-1;resize:none;overflow:hidden';
      ghost.addEventListener('input', function(){ if (ghost.value.indexOf(String.fromCharCode(10)) >= 0){ ghost.value = ghost.value.split(String.fromCharCode(10)).join(' '); window.liTypeEnter = true; } window.liTypeValue = ghost.value; });
      ghost.addEventListener('keydown', function(e){ e.stopPropagation(); if (e.key === 'Enter'){ e.preventDefault(); window.liTypeEnter = true; } });
      ['keyup','keypress'].forEach(function(t){ ghost.addEventListener(t, function(e){ e.stopPropagation(); }); });
      document.body.appendChild(ghost);
    }
    ghost.value = text || '';
    window.liTypeValue = ghost.value;
    window.liTypeEnter = false;
    ghost.focus();
  };
  window.liTypeSet = function(text){ if (ghost){ ghost.value = text || ''; } window.liTypeValue = text || ''; };
  window.liTypeStop = function(){ if (ghost){ ghost.blur(); } };
  window.liAsk = function(question, text, multi){
    window.liState = ''; window.liValue = '';
    build(!!multi);
    qEl.textContent = question;
    input.value = text || '';
    box.style.display = 'block';
    input.focus();
    try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
  };
})();
</script>
